name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Testler
        run: ./gradlew test --no-daemon

      - name: Doğruluk raporu özeti
        if: always()
        run: |
          if [ -f dsp/build/reports/nextone/dsp-dogruluk.md ]; then
            cat dsp/build/reports/nextone/dsp-dogruluk.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Raporları sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raporlar
          path: |
            dsp/build/reports/
            tuning/build/reports/
